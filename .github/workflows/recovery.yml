name: Production recovery verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build -- --webpack

  production-health:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Hostinger deployment and verify public routes
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://ohanahomesci.com/"
            "https://ohanahomesci.com/terrains"
            "https://ohanahomesci.com/terrains/missole-pk33"
            "https://ohanahomesci.com/realisations"
            "https://ohanahomesci.com/agence"
            "https://ohanahomesci.com/diaspora"
            "https://ohanahomesci.com/contact"
          )
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            urls+=(
              "https://ohanahomesci.com/ohana-logo/favicon/favicon.svg"
              "https://ohanahomesci.com/ohana-logo/favicon/favicon-32x32.png"
              "https://ohanahomesci.com/ohana-logo/app-icons/apple-touch-icon.png"
              "https://ohanahomesci.com/ohana-logo/app-icons/site.webmanifest"
              "https://ohanahomesci.com/ohana-logo/open-graph/ohana-home-open-graph-1200x630.png"
              "https://ohanahomesci.com/ohana-logo/web-optimized/ohana-home-logo-horizontal-no-tagline.svg"
              "https://ohanahomesci.com/ohana-logo/reverse/ohana-home-logo-white-orange.svg"
            )
          fi
          for attempt in {1..24}; do
            all_ok=true
            for url in "${urls[@]}"; do
              status=$(curl --silent --show-error --location --output /dev/null --write-out "%{http_code}" --max-time 20 "$url" || true)
              echo "Attempt $attempt: $url -> $status"
              if [ "$status" != "200" ]; then
                all_ok=false
              fi
            done
            if [ "$all_ok" = true ]; then
              echo "Production is healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Production did not become healthy within the verification window."
          exit 1

  visual-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application and browser
        run: |
          npm install
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Build and start the pull request version
        shell: bash
        run: |
          npm run build -- --webpack
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/ohana-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ohana-next.log
          exit 1

      - name: Test responsive pages and browser console
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch();
            const widths = [320, 375, 430, 768, 1280, 1920];
            const baseUrl = "http://127.0.0.1:3000";
            const errors = [];
            fs.mkdirSync("artifacts/screenshots", { recursive: true });
            for (const asset of [
              "/ohana-logo/favicon/favicon.svg",
              "/ohana-logo/favicon/favicon-16x16.png",
              "/ohana-logo/favicon/favicon-32x32.png",
              "/ohana-logo/app-icons/apple-touch-icon.png",
              "/ohana-logo/app-icons/site.webmanifest",
              "/ohana-logo/open-graph/ohana-home-open-graph-1200x630.png",
              "/ohana-logo/web-optimized/ohana-home-logo-horizontal-no-tagline.svg",
              "/ohana-logo/web-optimized/ohana-home-logo-horizontal-no-tagline-reverse.svg",
            ]) {
              const response = await fetch(`${baseUrl}${asset}`);
              if (response.status !== 200) throw new Error(`${asset} returned ${response.status}`);
            }
            for (const width of widths) {
              const page = await browser.newPage({ viewport: { width, height: 900 }, deviceScaleFactor: 1 });
              page.on("pageerror", error => errors.push(`${width}px pageerror: ${error.message}`));
              page.on("console", message => {
                if (message.type() === "error") errors.push(`${width}px console: ${message.text()}`);
              });
              const response = await page.goto(`${baseUrl}/`, { waitUntil: "networkidle", timeout: 60000 });
              if (!response || response.status() !== 200) throw new Error(`Homepage ${width}px returned ${response?.status()}`);

              const audit = await page.evaluate(() => {
                const logo = document.querySelector(".site-header .brand-logo");
                const image = document.querySelector(".site-header .brand-logo__image");
                const footer = document.querySelector(".footer");
                const footerLogo = document.querySelector(".footer .brand-logo__image");
                const style = logo ? getComputedStyle(logo) : null;
                return {
                  overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                  logoSrc: image instanceof HTMLImageElement ? image.currentSrc : "",
                  footerLogoSrc: footerLogo instanceof HTMLImageElement ? footerLogo.getAttribute("src") ?? "" : "",
                  logoBackground: style?.backgroundColor,
                  logoBorder: style?.borderTopWidth,
                  logoShadow: style?.boxShadow,
                  footerPresent: Boolean(footer),
                  favicon: Array.from(document.querySelectorAll('link[rel*="icon"]')).map(link => link.getAttribute("href")),
                  openGraph: document.querySelector('meta[property="og:image"]')?.getAttribute("content"),
                  schema: Array.from(document.querySelectorAll('script[type="application/ld+json"]')).some(
                    node => node.textContent?.includes('"RealEstateAgent"'),
                  ),
                };
              });

              if (audit.overflow > 1) throw new Error(`Homepage ${width}px overflows by ${audit.overflow}px`);
              if (!audit.footerPresent) throw new Error("Shared footer is missing");
              if (audit.logoBackground !== "rgba(0, 0, 0, 0)") throw new Error(`Logo background is ${audit.logoBackground}`);
              if (audit.logoBorder !== "0px") throw new Error(`Logo border is ${audit.logoBorder}`);
              if (audit.logoShadow !== "none") throw new Error(`Logo shadow is ${audit.logoShadow}`);
              if (!audit.footerLogoSrc.includes("/ohana-logo/reverse/ohana-home-logo-white-orange.svg")) {
                throw new Error(`Unexpected footer logo: ${audit.footerLogoSrc}`);
              }
              if (width <= 800 && !audit.logoSrc.includes("/ohana-home-logo-primary.svg")) {
                throw new Error(`Unexpected complete mobile logo: ${audit.logoSrc}`);
              }
              if (width > 800 && !audit.logoSrc.includes("/ohana-home-logo-white-orange.svg")) {
                throw new Error(`Unexpected complete desktop logo: ${audit.logoSrc}`);
              }
              if (!audit.favicon.some(href => href?.includes("/ohana-logo/favicon/favicon.svg"))) {
                throw new Error("SVG favicon metadata is missing");
              }
              if (!audit.openGraph?.includes("/ohana-logo/open-graph/ohana-home-open-graph-1200x630.png")) {
                throw new Error(`Unexpected Open Graph image: ${audit.openGraph}`);
              }
              if (!audit.schema) throw new Error("RealEstateAgent structured data is missing");

              if (width === 1280) {
                await page.evaluate(() => window.scrollTo({ top: 240, behavior: "instant" }));
                await page.locator(".site-header.is-scrolled").waitFor({ state: "visible" });
                await page.waitForFunction(() => {
                  const logo = document.querySelector(".site-header .brand-logo__image");
                  return logo instanceof HTMLImageElement
                    && logo.currentSrc.includes("/ohana-home-logo-primary.svg");
                });
                const scrolledLogo = await page.locator(".site-header .brand-logo__image").evaluate(
                  image => image instanceof HTMLImageElement ? image.currentSrc : "",
                );
                if (!scrolledLogo.includes("/ohana-home-logo-primary.svg")) {
                  throw new Error(`Unexpected scrolled logo: ${scrolledLogo}`);
                }
                await page.evaluate(() => window.scrollTo({ top: 0, behavior: "instant" }));
                await page.locator(".site-header.is-scrolled").waitFor({ state: "detached" });
              }

              if (width === 375) {
                await page.locator(".menu-btn").click();
                await page.locator("#mobile-navigation").waitFor({ state: "visible" });
                await page.keyboard.press("Escape");
                await page.locator("#mobile-navigation").waitFor({ state: "detached" });
              }

              await page.screenshot({ path: `artifacts/screenshots/home-${width}.png`, fullPage: true });
              await page.close();
            }
            for (const route of ["terrains", "terrains/missole-pk33", "realisations", "agence", "diaspora", "contact"]) {
              const page = await browser.newPage({ viewport: { width: 375, height: 900 }, deviceScaleFactor: 1 });
              page.on("pageerror", error => errors.push(`${route} pageerror: ${error.message}`));
              page.on("console", message => {
                if (message.type() === "error") errors.push(`${route} console: ${message.text()}`);
              });
              const response = await page.goto(`${baseUrl}/${route}`, { waitUntil: "networkidle", timeout: 60000 });
              if (!response || response.status() !== 200) throw new Error(`${route} returned ${response?.status()}`);
              await page.screenshot({ path: `artifacts/screenshots/${route.replaceAll("/", "-")}-375.png`, fullPage: true });
              await page.close();
            }
            await browser.close();
            if (errors.length) throw new Error(errors.join("\n"));
          })();
          NODE

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: branch-responsive-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
